name: Release Assets

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package-and-upload:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create generated asset bundles
        run: |
          set -euxo pipefail
          mkdir -p dist
          zip -r dist/web-site.zip web
          zip -r dist/docs-site.zip docs
          zip -r dist/screenshots.zip screenshots
          zip -r dist/android-ui-assets.zip android/app/src/main/res/drawable-nodpi
          sha256sum dist/*.zip > dist/SHA256SUMS.txt

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: generated-content-bundles
          path: dist/*

      - name: Upload bundles to release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/web-site.zip
            dist/docs-site.zip
            dist/screenshots.zip
            dist/android-ui-assets.zip
            dist/SHA256SUMS.txt
