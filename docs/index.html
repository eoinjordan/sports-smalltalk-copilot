<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sports Small Talk Copilot</title>
  <style>
    :root {
      --bg: #0b1220;
      --panel: #121b2e;
      --text: #e8eefc;
      --muted: #b5c2e3;
      --accent: #34d399;
      --accent-2: #38bdf8;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Segoe UI", system-ui, sans-serif;
      color: var(--text);
      background:
        radial-gradient(900px 500px at 10% -20%, #1f3b73 0%, transparent 60%),
        radial-gradient(900px 500px at 90% 120%, #124b40 0%, transparent 60%),
        var(--bg);
    }
    .wrap {
      max-width: 900px;
      margin: 0 auto;
      padding: 56px 20px 72px;
    }
    .card {
      background: color-mix(in oklab, var(--panel) 88%, black);
      border: 1px solid #2b3a5d;
      border-radius: 18px;
      padding: 28px;
      box-shadow: 0 18px 40px rgba(0,0,0,.28);
    }
    h1 {
      margin: 0 0 10px;
      font-size: clamp(2rem, 4vw, 2.8rem);
    }
    p {
      color: var(--muted);
      line-height: 1.6;
      margin: 0 0 16px;
    }
    .links {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-top: 22px;
    }
    a.btn {
      text-decoration: none;
      padding: 10px 14px;
      border-radius: 10px;
      border: 1px solid #35507f;
      color: var(--text);
      background: #172542;
      font-weight: 600;
    }
    a.btn.primary {
      border-color: transparent;
      background: linear-gradient(120deg, var(--accent), var(--accent-2));
      color: #042018;
    }
  </style>
</head>
<body>
  <main class="wrap">
    <section class="card">
      <h1>Sports Small Talk Copilot</h1>
      <p>
        Android app + FastAPI backend for generating useful sports small talk:
        context-aware openings, safe follow-ups, and quick explanations.
      </p>
      <p>
        Built for people who want enough matchday context to sound natural
        without pretending to be a pundit.
      </p>
      <div class="links">
        <a class="btn primary" href="https://github.com/eoinjordan/sports-smalltalk-copilot">GitHub Repo</a>
        <a class="btn" href="https://www.youtube.com/watch?app=desktop&amp;v=ypLoroougRw">Inspiration Clip</a>
      </div>
    </section>
  </main>
</body>
</html>
